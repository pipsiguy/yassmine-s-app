name: shanhai
description: 山海 — a Chinese-mythology notes app. Every note is a sacred site on your own ink-wash kingdom.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_animate: ^4.5.0
  sensors_plus: ^6.0.1
  path_provider: ^2.1.4
  google_fonts: ^6.2.1
  vibration: ^2.0.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  shaders:
    - shaders/ink_bleed.frag
    - shaders/water_ripple.frag
    - shaders/cloud.frag
    - shaders/paper_grain.frag
