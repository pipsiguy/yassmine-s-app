name: Build Android APK

on:
  push:
    branches:
      - "claude/research-ai-app-ideas-qRVqf"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.41.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          java -version
          gradle --version || true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build release APK (per-architecture)
        run: flutter build apk --release --split-per-abi

      - name: List built APKs
        run: |
          ls -lh build/app/outputs/flutter-apk/
          echo
          for f in build/app/outputs/flutter-apk/*.apk; do
            sz=$(du -h "$f" | cut -f1)
            echo "$f  ($sz)"
          done

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shanhai-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish rolling pre-release with APKs
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: shanhai-latest
          name: 山海 Shānhǎi — latest build
          body: |
            Latest Android APKs built from `${{ github.sha }}`.
            Install the one matching your phone's CPU:
            - `arm64-v8a` — almost all phones from the last 5 years
            - `armeabi-v7a` — older 32-bit ARM phones
            - `x86_64` — emulators
          files: build/app/outputs/flutter-apk/*.apk
          prerelease: true
          make_latest: false
